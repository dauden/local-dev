  wordpress:
    image: wordpress:6.6.1
    container_name: wordpress
    volumes:
      - ${ROOT_DIR}/wordpress/html:/var/www/html
      - ${ROOT_DIR}/wordpress/php.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ${ROOT_DIR}/wordpress/uploads.conf:/etc/apache2/conf-enabled/uploads.conf
    environment:
      - WORDPRESS_DB_NAME=ringkas
      - WORDPRESS_TABLE_PREFIX=wp_
      - WORDPRESS_DB_HOST=host.docker.internal
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - phpmyadmin
    restart: always
    ports:
      - 8085:80
    networks:
      - devlocal
